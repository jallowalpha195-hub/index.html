<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table {
            border: 1px solid white;
            margin-right: 24px;
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;





        }

        body {
            width: 80%;
            margin: 0 40px;
        }

        th,
        td {
            padding: 15px;
            /* border: 1px solid black; */
            margin-right: 16px;


        }

        .card {
            background-color: #e13d018e;
        }

        th {
            background-color: orangered;
            color: white;
        }

        h2 {
            color: orangered;
        }

        tfoot {
            color: orangered;
        }
    </style>
</head>

<body>
    <table>
        <h2>Household Grocery List</h2>

        <thead>
            <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Milk</td>
                <td>2 carton</td>
                <td>D 90</td>
            </tr>

            <tr class="card">
                <td>Eggs</td>
                <td>1 dozen</td>
                <td>D65</td>
            </tr>

            <tr>
                <td>Bread</td>
                <td>2 loaves</td>
                <td>D100</td>
            </tr>

            <tr class="card">
                <td>Bananas</td>
                <td>6</td>
                <td>D 40</td>
            </tr>

            <tr>
                <td>Coffee</td>
                <td>1 bag</td>
                <td>D175</td>
            </tr>

            <tr class="card">
                <td>rice</td>
                <td>5 kg</td>
                <td>D 220</td>
            </tr>

            <tr>
                <td>Cooking Oil</td>
                <td>1 bottle</td>
                <td>D 150</td>
            </tr>

            <tr class="card">
                <td>Tomatoes</td>
                <td>1 kg</td>
                <td>D 55</td>
            </tr>

            <tr>
                <td>Onions</td>
                <td>1 kg</td>
                <td>D 45</td>
            </tr>

            <tr class="card">
                <td>Chicken</td>
                <td>1 kg</td>
                <td>D 280</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Total</td>
                <td></td>
                <td>D 1220</td>

            </tr>
        </tfoot>
    </table>
</body>

</html>
